# Almond checks: free, no secrets, no API calls.
# Runs the same checks as `ai-bridge/bridge check` on every pull request.
name: Almond checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: almond-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run Almond checks
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: python3 ai-bridge/scripts/bridge.py check --ci --base "origin/$BASE_REF"
