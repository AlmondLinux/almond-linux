; Almond Linux AALDM: global shortcut for the Almond Launcher.
; Staged by scripts/build.sh as /usr/share/almond/lxqt/globalkeyshortcuts.conf.
; It is NOT installed as /etc/xdg/lxqt/globalkeyshortcuts.conf directly:
; Debian 13's lxqt-globalkeys (2.1.0-2) installs that path as a directory
; (holding Debian's default shortcuts in
; /etc/xdg/lxqt/globalkeyshortcuts.conf/globalkeyshortcuts.conf), so a file
; staged there collides with the package, and lxqt-globalkeysd, which only
; reads a file at that path, never sees Debian's defaults. The
; 0200-almond-desktop hook therefore writes a plain file at that path:
; Debian's default entries (Ctrl+Alt+T terminal, Print screenshot, the
; brightness and XF86 keys, ...) followed by the entry below. Debian's
; originals are kept in /usr/share/almond/lxqt/debian-defaults/.
;
; lxqt-globalkeysd reads every globalkeyshortcuts.conf in the XDG config
; directories only while ~/.config/lxqt/globalkeyshortcuts.conf does not
; exist; it then writes the complete list to that per-user file (lxqt-globalkeys
; 2.1.0 daemon/core.cpp saves right after loading), and from then on that file
; is used alone. Changes here reach new users only.
;
; Format (lxqt-globalkeys 2.1): one [<shortcut>.<number>] section per entry.
; "Super_L" alone fires when the left Super (Windows) key is pressed and
; released without another key; Super+<key> combinations do not trigger it.
; Alt+Tab and the Openbox shortcuts are not touched. Alt+F2 stays free:
; lxqt-runner, which registers it, is not installed.
;
; To change the key: LXQt Settings > Shortcut Keys, select "Almond Launch",
; and record a new shortcut (for example Alt+F1). Or edit the section name
; below, e.g. [Alt%2BF1.50] ("%2B" is how this file writes "+").
; Status: Implemented (source exists, untested); not seen working at runtime.

[Super_L.50]
Comment=Almond Launch
Enabled=true
Exec=almond-launch
