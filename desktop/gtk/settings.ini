# Almond Linux AALDM: GTK 3 fallback settings (Firefox ESR and other GTK apps).
# Installed as /etc/gtk-3.0/settings.ini. Per-user settings in
# ~/.config/gtk-3.0/settings.ini win (LXQt Appearance can write that file).
# Adwaita is built into GTK 3, so no extra theme package is needed.
# Status: Implemented (source exists, untested at runtime).
[Settings]
gtk-theme-name=Adwaita
gtk-icon-theme-name=Almond-Pure
gtk-font-name=Sans 10
gtk-application-prefer-dark-theme=false
gtk-enable-animations=false
