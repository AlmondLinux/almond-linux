# Almond Linux AALDM: runs inside the INSTALLED system, after the package
# step. Removes the live-only installer pieces that are Almond files (not
# packages) and undoes the 0300 hook's diversions. A leading "-" means a
# failing command does not stop the installation. Status: untested.
---
dontChroot: false
timeout: 60
script:
  - "-rm -f /usr/bin/almond-install /usr/share/applications/almond-install.desktop /etc/xdg/autostart/almond-install-icon.desktop /usr/libexec/almond/almond-install-icon"
  - "-rm -rf /usr/share/almond/calamares /etc/calamares"
  - "-dpkg-divert --local --rename --remove /usr/share/applications/calamares-install-debian.desktop"
  - "-dpkg-divert --local --rename --remove /etc/xdg/autostart/calamares-desktop-icon.desktop"
  - "-dpkg-divert --local --rename --remove /etc/calamares/settings.conf"
  - "-dpkg-divert --local --rename --remove /etc/calamares/modules/packages.conf"
  - "-dpkg-divert --local --rename --remove /etc/calamares/modules/welcome.conf"
