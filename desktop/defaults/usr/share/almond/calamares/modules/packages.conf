# Almond Linux AALDM: packages removed from the INSTALLED system.
# The live tools and the installer itself are only for the live session.
# Without live-config, the installed system gets no live user, no autologin
# and no passwordless sudo: live-config creates those at each live boot, and
# the installer copies the unmodified image (filesystem.squashfs).
# Only packages that are installed in the AALDM image are listed (apt refuses
# unknown names). Status: untested.
---
backend: apt
operations:
  - remove:
      - 'live-boot'
      - 'live-config'
      - 'live-config-systemd'
      - 'live-tools'
      - 'user-setup'
      - 'calamares'
      - 'calamares-settings-debian'
