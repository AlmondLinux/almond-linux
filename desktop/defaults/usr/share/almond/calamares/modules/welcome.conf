# Almond Linux AALDM: installer welcome page and requirement checks.
# Requirements as in Debian's settings (15 GB disk, 1 GB RAM); the real
# installed size of AALDM has not been measured yet. Status: untested.
---
showSupportUrl:         true
showKnownIssuesUrl:     true
showReleaseNotesUrl:    false

requirements:
    requiredStorage:    15
    requiredRam:        1.0
    check:
        - storage
        - ram
        - power
        - root
    required:
        - storage
        - ram
        - root
