# Almond Linux AALDM: Calamares installer sequence.
# Based on calamares-settings-debian 13.0.13-1 (Debian's live installer),
# with Almond branding, no plymouthcfg step (AALDM ships no plymouth) and an
# Almond clean-up step after the package step.
# The 0300 hook copies this file to /etc/calamares/settings.conf in the live
# image (Debian's copy is kept, diverted). Status: untested.
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id:     almondcleanup
  module: shellprocess
  config: shellprocess-almondcleanup.conf

oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - luksbootkeyfile
  - dpkg-unsafe-io
  - sources-media
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - bootloader-config
  - grubcfg
  - bootloader
  - packages
  - shellprocess@almondcleanup
  - initramfscfg
  - initramfs
  - dpkg-unsafe-io-undo
  - sources-media-unmount
  - sources-final
  - umount
- show:
  - finished

branding: almond
prompt-install: true
dont-chroot: false
