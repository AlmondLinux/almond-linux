; Almond Linux AALDM: PCManFM-Qt defaults for the LXQt profile (file manager
; and desktop). Installed as /etc/xdg/pcmanfm-qt/lxqt/settings.conf.
; PCManFM-Qt reads this whole file only while the user has no
; ~/.config/pcmanfm-qt/lxqt/ folder (no key-by-key merging), so it is
; complete on purpose. Status: Implemented (source exists, untested at runtime).

[System]
FallbackIconThemeName=Adwaita
SuCommand=lxsudo dbus-run-session -- %s
Archiver=lxqt-archiver
SIUnit=false
Terminal=x-terminal-emulator

[Behavior]
BookmarkOpenMethod=0
UseTrash=true
SingleClick=false
ConfirmDelete=true

[Desktop]
; Desktop icons: Home, Trash, and Computer (lists the drives). PCManFM-Qt 2.1
; cannot place one icon per drive on the desktop.
DesktopShortcuts=Home, Trash, Computer
; Default wallpaper: Almond Pure Light (the light desktop of the mockup).
; "zoom" fills the screen and keeps the proportions (crops on 4:3 screens).
WallpaperMode=zoom
Wallpaper=/usr/share/backgrounds/almond/almond-pure-light.svg
WallpaperDirectory=/usr/share/backgrounds/almond
BgColor=#f5deb3
; Dark labels on the light wallpaper; the label "shadow" is set to the
; wallpaper's cream so it does not show as a drop shadow.
FgColor=#2b2118
ShadowColor=#f5deb3
ShowHidden=false
SortOrder=ascending
SortColumn=name
Font="Sans,10,-1,5,50,0,0,0,0,0"
DesktopIconSize=48

[Volume]
; MountOnStartup=false: at login PCManFM-Qt 2.1 would otherwise mount every
; volume already present that GIO marks for automount (application.cpp,
; initVolumeManager). On some PCs (hot-plug SATA ports, USB-attached disks)
; that can include an internal disk. Not mounting it keeps the session from
; opening disks nobody asked for (security), saves the RAM and disk activity
; of mounts nobody uses, and protects second-hand test PCs whose internal
; disk may still hold someone else's data: that disk must never be mounted
; or read. Other drives can still be mounted by hand in the side pane.
MountOnStartup=false
; MountRemovable=true: a USB stick or card plugged in during the session is
; mounted (through udisks2 and polkit), as users expect.
MountRemovable=true
; AutoRun=false: no "removable medium inserted" dialog. Opening the medium
; is the user's choice (security), and no extra window is created (RAM).
AutoRun=false

[FolderView]
Mode=icon
ShowHidden=false
SortOrder=ascending
SortColumn=name
BigIconSize=48
SmallIconSize=24
SidePaneIconSize=24
ThumbnailIconSize=128

[Window]
FixedHeight=480
FixedWidth=760
LastWindowHeight=480
LastWindowWidth=760
RememberWindowSize=true
AlwaysShowTabs=false
ShowTabClose=true
SplitterPos=180
SidePaneMode=places

[Thumbnail]
; Conservative for old PCs: thumbnails only for local files up to 2 MiB
; (values are in KiB), for both built-in and external thumbnailers.
ShowThumbnails=true
MaxThumbnailFileSize=2048
MaxExternalThumbnailFileSize=2048
ThumbnailLocalFilesOnly=true
