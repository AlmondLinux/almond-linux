; Almond Linux AALDM: LXQt panel defaults (one thin panel at the top).
; Installed as /etc/xdg/lxqt/panel.conf. The panel copies these values into
; ~/.config/lxqt/panel.conf as soon as anything is changed in the panel.
; Left: Almond launcher button. Middle: task list. Right: tray icons
; (network from nm-tray, battery from LXQt power management, other apps),
; volume, clock.
; Status: Implemented (source exists, untested at runtime).

[General]
panels=panel1

[panel1]
position=Top
panelSize=28
iconSize=16
lineCount=1
width=100
width-percent=true
alignment=0
desktop=0
hidable=false
reserve-space=true
opacity=100
animation-duration=0
lockPanel=true
plugins=quicklaunch,taskbar,statusnotifier,tray,volume,worldclock

[quicklaunch]
type=quicklaunch
alignment=Left
apps\1\desktop=/usr/share/applications/almond-launch.desktop
apps\size=1

[taskbar]
type=taskbar
alignment=Left
buttonStyle=IconText
buttonWidth=180
groupingEnabled=false
closeOnMiddleClick=true
showOnlyOneDesktopTasks=false
autoRotate=true

[statusnotifier]
type=statusnotifier
alignment=Right

[tray]
type=tray
alignment=Right

[volume]
type=volume
alignment=Right
device=0

[worldclock]
type=worldclock
alignment=Right
useAdvancedManualFormat=true
customFormat="ddd, MMM d  HH:mm"
showWeekNumber=true
autoRotate=true
