; Almond Linux AALDM: LXQt session defaults.
; Installed as /etc/xdg/lxqt/session.conf; keys not set here fall back to
; LXQt's defaults in /usr/share/lxqt/session.conf.
; Status: Implemented (source exists, untested at runtime).

[General]
; Openbox, started through the Almond wrapper so it reads
; /etc/xdg/openbox/lxqt-rc.xml (LXQt starts this program without arguments,
; so "openbox" alone would use Debian's generic rc.xml instead).
; To use plain Openbox: window_manager=openbox
window_manager=almond-openbox
; LXQt's own "Are you sure?" dialog for leave actions started elsewhere.
; The Almond Launcher asks inside the launcher and does not trigger it.
leave_confirmation=true
