; Almond Linux AALDM: LXQt appearance defaults.
; Installed as /etc/xdg/lxqt/lxqt.conf. Only the keys below are set here;
; anything missing falls back to LXQt's own defaults in /usr/share/lxqt/.
; Per-user changes go to ~/.config/lxqt/lxqt.conf (LXQt Appearance writes it).
; Status: Implemented (source exists, untested at runtime).

[General]
; Almond Pure icon theme (directory /usr/share/icons/Almond-Pure).
icon_theme=Almond-Pure
; LXQt theme = panel and LXQt tool styling (QSS): dark panel by default.
theme=almond-pure-dark
; Lets LXQt Appearance load the palette that matches a chosen LXQt theme.
palette_override=true
single_click_activate=false
tool_button_style=ToolButtonTextBesideIcon

; Widget colours for Qt applications. These are the values of the
; "Almond-pure-light" palette (light windows under the light Openbox frame,
; as in the approved light desktop mockup).
[Palette]
base_color=#fbf9f4
highlight_color=#8b5a2b
highlighted_text_color=#f5f2eb
link_color=#2f5a8a
link_visited_color=#8b5a2b
text_color=#2b2118
tooltip_base_color=#2b2118
tooltip_text_color=#f5deb3
window_color=#f5f2eb
window_text_color=#2b2118

[Qt]
; Fusion is built into Qt (no extra package, no animations of its own).
style=Fusion
font="Sans,10,-1,5,50,0,0,0,0,0"
doubleClickInterval=400
wheelScrollLines=3
